name: rmscanner
description: "RMScanner AI - Total Free Premium Pro Scanner App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  go_router: ^17.0.1
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  camera: ^0.11.3
  image_picker: ^1.2.1
  file_picker: ^10.3.8
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  google_mlkit_text_recognition: ^0.15.0
  pdf: ^3.11.3
  printing: ^5.14.2
  image: ^4.5.4
  share_plus: ^12.0.1
  shared_preferences: ^2.5.5
  uuid: ^4.5.2
  open_filex: ^4.7.0
  syncfusion_flutter_pdf: ^28.1.33
  signature: ^6.3.0
  cunning_document_scanner: ^1.4.0
  url_launcher: ^6.3.2
  flutter_image_compress: ^2.3.0
  smooth_page_indicator: ^2.0.1
  google_mobile_ads: ^7.0.0
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/logo.png
    - assets/app_icon.png

  fonts:
    - family: SamsungOne
      fonts:
        - asset: assets/fonts/SamsungOne-400.ttf
        - asset: assets/fonts/SamsungOne-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
