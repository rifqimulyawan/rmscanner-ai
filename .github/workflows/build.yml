name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/app-release.aab

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Precache iOS engine
        run: flutter precache --ios

      - name: Generate and patch Podfile
        run: |
          flutter build ios --config-only --no-codesign || true
          if [ -f ios/Podfile ]; then
            ruby -e '
              content = File.read("ios/Podfile")
              unless content.include?("require File.expand_path")
                prefix = <<~RUBY
                  def flutter_root
                    generated_xcode_build_settings_path = File.expand_path(File.join("..", "Flutter", "Generated.xcconfig"), __FILE__)
                    unless File.exist?(generated_xcode_build_settings_path)
                      raise "#{generated_xcode_build_settings_path} must exist."
                    end
                    File.foreach(generated_xcode_build_settings_path) do |line|
                      matches = line.match(/FLUTTER_ROOT\\=(.*)/)
                      return matches[1].strip if matches
                    end
                    raise "FLUTTER_ROOT not found."
                  end
                  require File.expand_path(File.join("packages", "flutter_tools", "bin", "podhelper"), flutter_root)
                  flutter_ios_podfile_setup
                RUBY
                content = prefix + content
              end
              content.gsub!(/# *platform :ios.*/, "platform :ios, \x2715.5\x27")
              content.gsub!(/IPHONEOS_DEPLOYMENT_TARGET.*?\x27\d+\.\d+(?:\.\d+)?\x27/, "IPHONEOS_DEPLOYMENT_TARGET = \x2715.5\x27")
              unless content.include?("EXCLUDED_ARCHS")
                content.gsub!(/post_install do \|installer\|/) do |match|
                  match + "\n  installer.pods_project.build_configurations.each do |config|\n    config.build_settings[\"EXCLUDED_ARCHS[sdk=*]\"] = \"armv7\"\n    config.build_settings[\"IPHONEOS_DEPLOYMENT_TARGET\"] = \"15.5\"\n  end\n"
                end
              end
              File.write("ios/Podfile", content)
            '
            echo "=== Patched Podfile ==="
            cat ios/Podfile
          fi

      - name: Install pods manually
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA from build
        run: |
          mkdir -p build/ios/ipa
          RUNNER_APP=$(find build/ios -name "Runner.app" -type d | head -1)
          if [ -z "$RUNNER_APP" ]; then
            echo "Runner.app not found!"
            find build/ios -type d -maxdepth 3
            exit 1
          fi
          echo "Found Runner.app at: $RUNNER_APP"
          cd "$(dirname "$RUNNER_APP")"
          rm -rf Payload
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/build/ios/ipa/RMScannerAI.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-release
          path: build/ios/ipa/RMScannerAI.ipa

  release:
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-release
      - uses: actions/download-artifact@v4
        with:
          name: aab-release
      - uses: actions/download-artifact@v4
        with:
          name: ipa-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: RMScanner AI ${{ github.ref_name }}
          body: |
            ## RMScanner AI ${{ github.ref_name }}

            ### Android
            - **APK**: `app-release.apk` (sideload)
            - **AAB**: `app-release.aab` (Play Store)

            ### iOS
            - **IPA**: `RMScannerAI.ipa` (sideload via AltStore/Sideloadly)

            ### Install APK
            1. Download `app-release.apk`
            2. Enable "Install from unknown sources" on your phone
            3. Install the APK

            ### Install IPA
            1. Download `RMScannerAI.ipa`
            2. Use [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io) to install
            3. Trust the developer in Settings > General > VPN & Device Management
          files: |
            app-release.apk
            app-release.aab
            RMScannerAI.ipa
          draft: true
          prerelease: false
